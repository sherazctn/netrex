name: Deploy Netrex to Hostinger

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is master
  # Refresh the homepage Instagram posts every day (09:17 Dubai time) and allow manual runs.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

# One deploy at a time: two FTP syncs running together can corrupt the server's sync state.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    # Latest 10 Instagram posts for the homepage. The token comes from the repository secret
    # INSTAGRAM_ACCESS_TOKEN and is never written to the site or the logs.
    - name: Fetch Instagram posts
      continue-on-error: true
      env:
        INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      run: node scripts/fetch-instagram.mjs

    # Pre-render every sitemap page to static HTML so search engines and AI crawlers
    # get full content without running JavaScript. Never blocks the deploy.
    - name: Install headless browser for pre-rendering
      continue-on-error: true
      run: |
        npm install --no-save playwright@1.56.0
        npx playwright install --with-deps chromium

    - name: Pre-render pages
      continue-on-error: true
      run: node scripts/prerender.mjs

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./
        # New sync-state file after two overlapping deploys left the old one out of date.
        state-name: .ftp-deploy-sync-state-v2.json

    # Notify Bing / IndexNow engines about updated pages (feeds ChatGPT search and Copilot).
    - name: Notify search engines (IndexNow)
      continue-on-error: true
      run: node scripts/indexnow.mjs
