name: Deploy Netrex to Hostinger

on:
  push:
    branches:
      - main # Change this to 'master' if your default branch is master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: npm install

    - name: Build Project
      run: npm run build

    # Pre-render every sitemap page to static HTML so search engines and AI crawlers
    # get full content without running JavaScript. Never blocks the deploy.
    - name: Install headless browser for pre-rendering
      continue-on-error: true
      run: |
        npm install --no-save playwright@1.56.0
        npx playwright install --with-deps chromium

    - name: Pre-render pages
      continue-on-error: true
      run: node scripts/prerender.mjs

    - name: Deploy via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./dist/
        server-dir: ./